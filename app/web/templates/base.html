<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Ferrapex · Encomendas{% endblock %}</title>
  <style>
    :root {
      --bg: #f6f7f9; --surface: #fff; --text: #1d2330; --muted: #5f6b7a; --border: #dde2e8;
      --accent: #1f5fbf; --ok-bg: #e3f4e8; --ok: #1d6b36; --warn-bg: #fdf1d8; --warn: #8a5a00;
      --err-bg: #fbe4e4; --err: #a12626;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14171c; --surface: #1c2027; --text: #e6e9ee; --muted: #9aa4b2; --border: #2e343d;
        --accent: #6ea3f0; --ok-bg: #173323; --ok: #7fd49b; --warn-bg: #3a2e12; --warn: #f0c46b;
        --err-bg: #3d1a1a; --err: #f29b9b;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
    header { background: var(--surface); border-bottom: 1px solid var(--border); }
    .wrap { max-width: 1040px; margin: 0 auto; padding: 0 16px; }
    header .wrap { display: flex; align-items: center; gap: 24px; height: 56px; }
    header strong { font-size: 16px; }
    nav a { color: var(--muted); text-decoration: none; margin-right: 16px; }
    nav a:hover, nav a.active { color: var(--text); }
    main { padding: 24px 16px 48px; }
    h1 { font-size: 22px; margin: 0 0 16px; }
    h2 { font-size: 17px; margin: 28px 0 10px; }
    a { color: var(--accent); }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px; }
    .table-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
    th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600; }
    tr:last-child td { border-bottom: 0; }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
    td.wrap-text { white-space: normal; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; }
    .badge.processed { background: var(--ok-bg); color: var(--ok); }
    .badge.needs_review, .badge.pending { background: var(--warn-bg); color: var(--warn); }
    .badge.failed { background: var(--err-bg); color: var(--err); }
    .muted { color: var(--muted); }
    button { font: inherit; background: var(--accent); color: #fff; border: 0; border-radius: 6px; padding: 8px 16px; cursor: pointer; }
    button:disabled { opacity: .6; cursor: progress; }
    .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
    .toolbar h1 { margin: 0; }
    .stats { display: flex; gap: 24px; flex-wrap: wrap; }
    .stats div span { display: block; font-size: 22px; font-weight: 600; }
    .alert { border-radius: 8px; padding: 12px 16px; margin-bottom: 16px; }
    .alert.err { background: var(--err-bg); color: var(--err); }
    dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin: 0; }
    dt { color: var(--muted); }
    dd { margin: 0; }
    pre { white-space: pre-wrap; margin: 0; font: 13px/1.5 ui-monospace, Menlo, monospace; }
    ul.issues { margin: 0; padding-left: 18px; }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <strong>Ferrapex</strong>
      <nav>
        <a href="/" class="{{ 'active' if request.url.path in ['/', '/ui/sync'] else '' }}">Encomendas</a>
        <a href="/ui/customers" class="{{ 'active' if request.url.path == '/ui/customers' else '' }}">Clientes</a>
        <a href="/ui/emails" class="{{ 'active' if request.url.path == '/ui/emails' else '' }}">Emails</a>
        <a href="/docs">API</a>
      </nav>
    </div>
  </header>
  <main class="wrap">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
