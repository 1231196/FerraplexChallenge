[project]
name = "ferrapex-orders"
version = "0.1.0"
description = "Importação de encomendas a partir de emails Ferrapex"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "jinja2>=3.1.6",
]

[project.scripts]
ferrapex = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "ollama: testes que chamam um Ollama real (correr com -m ollama)",
]
addopts = "-m 'not ollama'"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
